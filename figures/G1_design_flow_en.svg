ll="#000000" text-anchor="middle">article-cluster bootstrap (B = 2,000)</text><line x1="930" y1="170" x2="1014.3" y2="85.7" stroke="#000000" stroke-width="1.1"/><polygon points="1020,80 1016.9,88.2 1011.8,83.1" fill="#000000"/><rect x="1020" y="144" width="360" height="72" rx="4" fill="#fff" stroke="#000000" stroke-width="1.4" /><text x="1200" y="166" font-size="12.5" font-weight="700" font-style="normal" fill="#000000" text-anchor="middle">Verdict stability</text><text x="1200" y="184" font-size="10.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">argmax agreement</text><text x="1200" y="199" font-size="10.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">own R1 vs own R3</text><line x1="930" y1="170" x2="1012.0" y2="179.1" stroke="#000000" stroke-width="1.1"/><polygon points="1020,180 1011.7,182.7 1012.4,175.5" fill="#000000"/><rect x="1020" y="244" width="360" height="72" rx="4" fill="#fff" stroke="#000000" stroke-width="1.4" /><text x="1200" y="266" font-size="12.5" font-weight="700" font-style="normal" fill="#000000" text-anchor="middle">False-support mass</text><text x="1200" y="284" font-size="10.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">p(SUPPORTED) + p(REFUTED)</text><text x="1200" y="299" font-size="10.5" font-weight="400" font-style="normal" fill="#000000" text-anchor="middle">near and far; overcommit τ = 0.7</text><line x1="930" y1="170" x2="1014.9" y2="273.8" stroke="#000000" stroke-width="1.1"/><polygon points="1020,280 1012.1,276.1 1017.7,271.5" fill="#000000"/><text x="20" y="346" font-size="10.5" font-weight="400" font-style="italic" fill="#000000" text-anchor="start">274 claims × 7 conditions = 1,918 presentations per model. Reference labels are mechanically assigned, provisional anchors (no REFUTED anchors); scores measure agreement with the anchors.</text></svg>